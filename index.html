<!DOCTYPE html>
<html>
<head>
  <title>Smart Product Explorer</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }

    input, select {
      padding: 8px;
      margin: 10px 5px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
    }

    .card img {
      height: 120px;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <h2>🛒 Smart Product Explorer</h2>

  <!-- Search -->
  <input type="text" id="search" placeholder="Search products..." />

  <!-- Category Filter -->
  <select id="category">
    <option value="all">All Categories</option>
  </select>

  <!-- Sort -->
  <select id="sort">
    <option value="default">Sort By</option>
    <option value="low">Price: Low to High</option>
    <option value="high">Price: High to Low</option>
  </select>

  <!-- Products -->
  <div class="products" id="products"></div>

  <script src="script.js"></script>
</body>
</html>
