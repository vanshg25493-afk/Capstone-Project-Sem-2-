<!DOCTYPE html>
<html>
<head>
  <title>Smart Product Explorer</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }

    input, select {
      padding: 8px;
      margin: 10px 5px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .card img {
      height: 120px;
      object-fit: contain;
    }

    .no-data {
      text-align: center;
      font-size: 18px;
      margin-top: 20px;
      color: gray;
    }
  </style>
</head>

<body>

  <h2>🛒 Smart Product Explorer</h2>

  <!-- Search -->
  <input type="text" id="search" placeholder="Search products..." />

  <!-- Category Filter -->
  <select id="category">
    <option value="all">All Categories</option>
  </select>

  <!-- Sort -->
  <select id="sort">
    <option value="default">Sort By</option>
    <option value="low">Price: Low to High</option>
    <option value="high">Price: High to Low</option>
  </select>

  <!-- Products -->
  <div class="products" id="products"></div>

  <script>
    let allProducts = [];

    // Fetch products
    async function fetchProducts() {
      const res = await fetch("https://fakestoreapi.com/products");
      const data = await res.json();

      allProducts = data;
      loadCategories(data);
      updateProducts();
    }

    // Show products
    function showProducts(products) {
      const container = document.getElementById("products");
      container.innerHTML = "";

      if (products.length === 0) {
        container.innerHTML = "<p class='no-data'>No products found 😢</p>";
        return;
      }

      products.forEach(p => {
        container.innerHTML += `
          <div class="card">
            <img src="${p.image}" />
            <h4>${p.title.slice(0, 40)}</h4>
            <p>₹ ${p.price}</p>
            <p>⭐ ${p.rating.rate}</p>
          </div>
        `;
      });
    }

    // Load categories
    function loadCategories(products) {
      const categories = [...new Set(products.map(p => p.category))];
      const select = document.getElementById("category");

      categories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
      });
    }

    // Main update function (search + filter + sort)
    function updateProducts() {
      const searchValue = document.getElementById("search").value.toLowerCase();
      const categoryValue = document.getElementById("category").value;
      const sortValue = document.getElementById("sort").value;

      let result = [...allProducts];

      // 🔍 Search
      result = result.filter(p =>
        p.title.toLowerCase().includes(searchValue)
      );

      // 📂 Category filter
      if (categoryValue !== "all") {
        result = result.filter(p => p.category === categoryValue);
      }

      // 🔃 Sort
      if (sortValue === "low") {
        result.sort((a, b) => a.price - b.price);
      } else if (sortValue === "high") {
        result.sort((a, b) => b.price - a.price);
      }

      showProducts(result);
    }

    // Event listeners
    document.getElementById("search").addEventListener("input", updateProducts);
    document.getElementById("category").addEventListener("change", updateProducts);
    document.getElementById("sort").addEventListener("change", updateProducts);

    // Init
    fetchProducts();
  </script>

</body>
</html>
